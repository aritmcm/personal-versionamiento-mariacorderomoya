<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>María Cordero</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --deep:     #050a12;
      --midnight: #090f1c;
      --navy:     #0d1b35;
      --blue:     #1a3a6e;
      --azure:    #2563b0;
      --sky:      #3b82f6;
      --glow:     #60a5fa;
      --frost:    #bfdbfe;
      --white:    #f0f6ff;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--deep);
      font-family: 'Montserrat', sans-serif;
      color: var(--white);
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .aurora {
      position: fixed; inset: 0; z-index: 0;
      overflow: hidden;
    }
    .aurora span {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      animation: drift 12s ease-in-out infinite alternate;
    }
    .aurora span:nth-child(1) {
      width: 55vw; height: 55vw;
      background: radial-gradient(circle, #1a3a6e88 0%, transparent 70%);
      top: -10%; left: -15%;
      animation-duration: 14s;
    }
    .aurora span:nth-child(2) {
      width: 45vw; height: 45vw;
      background: radial-gradient(circle, #2563b066 0%, transparent 70%);
      bottom: -10%; right: -10%;
      animation-duration: 11s; animation-delay: -5s;
    }
    .aurora span:nth-child(3) {
      width: 35vw; height: 35vw;
      background: radial-gradient(circle, #3b82f633 0%, transparent 70%);
      top: 40%; left: 50%;
      animation-duration: 16s; animation-delay: -8s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(4vw, 3vh) scale(1.08); }
    }

    .grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(59,130,246,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,.06) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .cover {
      position: relative; z-index: 10;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .chip {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(.65rem, 1.2vw, .85rem);
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--glow);
      border: 1px solid rgba(96,165,250,.3);
      padding: .45em 1.6em;
      border-radius: 100px;
      backdrop-filter: blur(8px);
      background: rgba(96,165,250,.06);
      opacity: 0;
      animation: fadeUp .8s ease forwards .3s;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 10vw, 8.5rem);
      line-height: .95;
      margin: .55em 0 .35em;
      opacity: 0;
      animation: fadeUp 1s ease forwards .65s;
    }
    .name em {
      font-style: italic;
      background: linear-gradient(120deg, var(--frost), var(--sky));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      display: flex; align-items: center; gap: 1rem;
      width: min(420px, 80vw);
      margin: 0 auto 1.6rem;
      opacity: 0;
      animation: fadeUp .8s ease forwards 1s;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--azure), transparent);
    }
    .divider span {
      font-size: .7rem; letter-spacing: .2em;
      color: var(--glow); opacity: .7;
    }

    .subtitle {
      font-size: clamp(.85rem, 1.8vw, 1.1rem);
      font-weight: 200;
      letter-spacing: .08em;
      color: var(--frost);
      opacity: 0;
      max-width: 520px;
      line-height: 1.75;
      animation: fadeUp .9s ease forwards 1.2s;
    }

    .cta {
      margin-top: 3rem;
      display: flex; align-items: center; gap: .8rem;
      font-size: .75rem; letter-spacing: .25em; text-transform: uppercase;
      color: var(--sky);
      opacity: 0;
      animation: fadeUp .8s ease forwards 1.6s;
    }
    .cta-line {
      width: 40px; height: 1px;
      background: var(--sky);
      animation: expand 1.2s ease forwards 2s;
      transform-origin: left;
      transform: scaleX(0);
    }

    .dots {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }
    .dot {
      position: absolute;
      border-radius: 50%;
      background: var(--sky);
      opacity: 0;
      animation: float linear infinite;
    }

    .corner {
      position: fixed;
      width: 90px; height: 90px;
      border-color: rgba(96,165,250,.25);
      border-style: solid;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.8s;
      z-index: 5;
    }
    .corner-tl { top: 2rem; left: 2rem; border-width: 1px 0 0 1px; }
    .corner-br { bottom: 2rem; right: 2rem; border-width: 0 1px 1px 0; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes expand {
      to { transform: scaleX(1); }
    }
    @keyframes float {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      10%  { opacity: .5; }
      90%  { opacity: .3; }
      100% { opacity: 0; transform: translateY(-80vh) scale(.5); }
    }
  </style>
</head>
<body>

  <div class="aurora">
    <span></span><span></span><span></span>
  </div>

  <div class="grid"></div>

  <div class="dots" id="dots"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-br"></div>

  <main class="cover">
    <div class="chip">Bienvenid@ a mi espacio</div>

    <h1 class="name">
      María<br><em>Cordero</em>
    </h1>

    <div class="divider"><span>✦</span></div>

    <p class="subtitle">
      Un recorrido personal por quien soy,<br>
      mis pasiones, mi historia y todo lo que me define.
    </p>

    <div class="cta">
      <div class="cta-line"></div>
      Conoce más sobre mí
      <div class="cta-line" style="transform-origin:right"></div>
    </div>
  </main>

  <script>
    const container = document.getElementById('dots');
    for (let i = 0; i < 30; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      const size = Math.random() * 3 + 1;
      d.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        bottom:${Math.random()*20}%;
        animation-duration:${8 + Math.random()*14}s;
        animation-delay:${Math.random()*10}s;
        opacity:0;
      `;
      container.appendChild(d);
    }
  </script>
</body>
</html>
